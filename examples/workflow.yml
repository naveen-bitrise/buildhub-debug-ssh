# Example: SSH into the Build Hub runner, on demand.
#
# A session opens when:
#   - the workflow is started manually with "debug_enabled", or
#   - a failed job is re-run with "Enable debug logging" ticked and fails again.
# (Not on every failure: each session holds the runner until it ends.)
#
# Prerequisites (one-time): a relay (relays/), the GitHub secret/variables it
# prints, and the warm-up snippet in your runner pool (warmup/).

name: CI

on:
  push:
  workflow_dispatch:
    inputs:
      debug_enabled:
        type: boolean
        description: Open an SSH debug session
        default: false

jobs:
  build:
    runs-on: <your-bitrise-runner-label>
    steps:
      - uses: actions/checkout@v4

      # ... your build / test steps ...

      - name: Debug SSH
        if: ${{ !cancelled() && (inputs.debug_enabled || (failure() && runner.debug == '1')) }}
        uses: naveen-bitrise/buildhub-debug-ssh@v1
        with:
          relay-host: ${{ vars.RELAY_HOST }}
          relay-known-hosts: ${{ vars.RELAY_KNOWN_HOSTS }}
          tunnel-key: ${{ secrets.RELAY_TUNNEL_KEY }}
          # Optional:
          # github-users: alice,bob     # default: whoever triggered / re-ran the job
          # start-minutes: 30
          # extend-minutes: 15
          # max-minutes: 120
